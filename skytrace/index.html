<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyTrace</title>
  </head>
  <body>
    <div id="map"></div>

    <div class="skyTraceLayerPanel">
      <div class="skyTracePanelTitle">Map Style</div>
      <button onclick="changeSkyTraceMapLayer('standard')">Standard</button>
      <button onclick="changeSkyTraceMapLayer('dark')">Dark</button>
      <button onclick="changeSkyTraceMapLayer('satellite')">Satellite</button>
      <button onclick="changeSkyTraceMapLayer('terrain')">Terrain</button>

      <div class="skyTraceWeatherToggle">
        <label><input type="checkbox" id="skyTraceWeatherCheckbox" onchange="toggleSkyTraceRadar()">Weather Radar</label>
      </div>
    </div>

    </div>

    <div class="skyTraceAircraftPanel" id="skyTraceAircraftPanel">
      <button class="skyTraceAircraftPanelClose" onclick="closeSkyTraceAircraftPanel()">X</button>

      <div class="skyTracePanelTitle">Aircraft</div>
      <h2 id="skyTraceAircraftCallsign">N/A</h2>

      <div class="skyTraceAircraftGrid">
        <div>
          <span>Altitude</span>
          <strong id="skyTraceAircraftAltitude">N/A</strong>
        </div>

        <div>
          <span>Speed</span>
          <strong id="skyTraceAircraftSpeed">N/A</strong>
        </div>

        <div>
          <span>Heading</span>
          <strong id="skyTraceAircraftHeading">N/A</strong>
        </div>

        <div>
          <span>Registration</span>
          <strong id="skyTraceAircraftRegistration">N/A</strong>
        </div>

        <div>
          <span>Aircraft Type</span>
          <strong id="skyTraceAircraftType">N/A</strong>
        </div>

        <div>
          <span>ICAO</span>
          <strong id="skyTraceAircraftICAO">N/A</strong>
        </div>
      
      </div>
    
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
