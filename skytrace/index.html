<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyTrace</title>
  </head>
  <body>
    <div id="map"></div>

    <div class="skyTraceSearchPanel">
      <input id="skyTraceFlightSearch" type="text" placeholder="Search Flight, Registration or ICAO" autocomplete="off">
      <div id="skyTraceSearchResults" class="skyTraceSearchResults"></div>
    </div>

    <div class="skyTraceLayerPanel">
      <div class="skyTracePanelTitle">Map Style</div>
      <button onclick="changeSkyTraceMapLayer('standard')">Standard</button>
      <button onclick="changeSkyTraceMapLayer('dark')">Dark</button>
      <button onclick="changeSkyTraceMapLayer('satellite')">Satellite</button>
      <button onclick="changeSkyTraceMapLayer('terrain')">Terrain</button>

      <div class="skyTraceWeatherToggle">
        <label><input type="checkbox" id="skyTraceWeatherCheckbox" onchange="toggleSkyTraceRadar()">Weather Radar</label>
      </div>
    </div>

    </div>

    <div class="skyTraceAircraftPanel" id="skyTraceAircraftPanel">
      

      <div class="skyTracePanelTitle">Aircraft</div>
      <h2 id="skyTraceAircraftCallsign">N/A</h2>
      <div id="skyTraceAircraftAirline">Unknown Airline</div>

      <div class="skyTraceAircraftRoute">
        <div>
          <span>From</span>
          <strong id="skyTraceAircraftOrigin">N/A</strong>
        </div>
        <div>
          <span>To</span>
          <strong id="skyTraceAircraftDestination">N/A</strong>
        </div>
      </div>

      <div class="skyTraceAircraftGrid">
        <div>
          <span>Altitude</span>
          <strong id="skyTraceAircraftAltitude">N/A</strong>
        </div>

        <div>
          <span>Speed</span>
          <strong id="skyTraceAircraftSpeed">N/A</strong>
        </div>

        <div>
          <span>Heading</span>
          <strong id="skyTraceAircraftHeading">N/A</strong>
        </div>

        <div>
          <span>Registration</span>
          <strong id="skyTraceAircraftRegistration">N/A</strong>
        </div>

        <div>
          <span>Aircraft Type</span>
          <strong id="skyTraceAircraftType">N/A</strong>
        </div>

        <div>
          <span>ICAO</span>
          <strong id="skyTraceAircraftICAO">N/A</strong>
        </div>
      
      </div>
    
    </div>

    <div class="skyTraceAirportPanel" id="skyTraceAirportPanel">

      <button class="skyTraceAirportPanelClose" onclick="closeAirportPanel()">x</button>
      
      <div class="skyTracePanelTitle">Airport</div>
      <h2 id="skyTraceAirportName">N/A</h2>

      <div class="skyTraceAirportCode">
        <span id="skyTraceAirportIATA">---</span>
        <span id="skyTraceAirportICAO">---</span>
      </div>

      <div class="skyTraceAirportInfo">
        <div>
          <span>City</span>
          <strong id="skyTraceAirportCity">N/A</strong>
        </div>

        <div>
          <span>Country</span>
          <strong id="skyTraceAirportCountry">N/A</strong>
        </div>

        <div>
          <span>Elevation</span>
          <strong id="skyTraceAirportElevation">N/A</strong>
        </div>
      </div>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
